name: Build KytyPS5 DroidDeck AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kytyps5-appimage
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REPO: KytyPS5/KytyPS5
      OUTPUT_NAME: KytyPS5-DroidDeck-x86_64.AppImage
      PACKAGE_REV: "12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest KytyPS5 release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest")"
          TAG="$(jq -r '.tag_name' <<< "$JSON")"
          URL="$(jq -r '.assets[] | select(.name | test("Linux-x86_64\\.tar\\.gz$")) | .browser_download_url' <<< "$JSON" | head -1)"
          NAME="$(jq -r '.assets[] | select(.name | test("Linux-x86_64\\.tar\\.gz$")) | .name' <<< "$JSON" | head -1)"
          test -n "$TAG" && test "$TAG" != null
          test -n "$URL" && test "$URL" != null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_url=$URL" >> "$GITHUB_OUTPUT"
          echo "asset_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}-droiddeck.${PACKAGE_REV}" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            busybox-static \
            clang \
            cmake \
            glslang-tools \
            libasound2-dev \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libgl1 \
            libglvnd0 \
            libglx0 \
            libopengl0 \
            libpulse-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            lld \
            ninja-build \
            pkg-config \
            wayland-protocols

      - name: Install Qt 6.10.3
        if: steps.existing.outputs.exists != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Download official KytyPS5 package
        if: steps.existing.outputs.exists != 'true'
        env:
          ASSET_URL: ${{ steps.upstream.outputs.asset_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 -o kyty.tar.gz "$ASSET_URL"
          mkdir upstream
          tar -xzf kyty.tar.gz -C upstream
          test -x upstream/kyty_emulator
          file upstream/kyty_emulator

      - name: Reuse previously built patched core
        id: reuse_core
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="${TAG}-droiddeck.10"
          rm -rf cached-core squashfs-root

          if gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found patched core release: $PREVIOUS_TAG"
            gh release download "$PREVIOUS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "KytyPS5-DroidDeck-x86_64.AppImage" \
              --output cached-core.AppImage
            chmod +x cached-core.AppImage
            ./cached-core.AppImage --appimage-extract >/dev/null
            test -x squashfs-root/usr/lib/kytyps5/kyty_emulator
            cp squashfs-root/usr/lib/kytyps5/kyty_emulator upstream/kyty_emulator
            chmod +x upstream/kyty_emulator
            file upstream/kyty_emulator
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "No matching r10 core for $TAG; source build required."
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout KytyPS5 source
        if: steps.existing.outputs.exists != 'true' && steps.reuse_core.outputs.reused != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "$TAG" \
            --recurse-submodules \
            --shallow-submodules \
            "https://github.com/$UPSTREAM_REPO.git" \
            kyty-source

      - name: Apply DroidDeck FEX memory patch
        if: steps.existing.outputs.exists != 'true' && steps.reuse_core.outputs.reused != 'true'
        run: |
          set -euo pipefail
          python3 patches/patch_fex_sparse_backing.py \
            kyty-source/src/kernel/memoryAddressSpace.inc

          grep -n "DroidDeck/FEX" \
            kyty-source/src/kernel/memoryAddressSpace.inc
          grep -n "pread\|pwrite" \
            kyty-source/src/kernel/memoryAddressSpace.inc

      - name: Build patched KytyPS5 core
        if: steps.existing.outputs.exists != 'true' && steps.reuse_core.outputs.reused != 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          cmake -S kyty-source -B build-kyty \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_BUILD_ORIGIN=Fork \
            -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY" \
            -DKYTY_RELEASE_TAG="${TAG}-droiddeck-fex" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

          cmake --build build-kyty \
            --target kyty_emulator \
            --parallel

          test -x build-kyty/kyty_emulator
          file build-kyty/kyty_emulator
          build-kyty/kyty_emulator --help >/dev/null

          cp build-kyty/kyty_emulator upstream/kyty_emulator
          chmod +x upstream/kyty_emulator

      - name: Build Big Picture frontend
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cmake -S droiddeck-launcher -B build-launcher \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build-launcher --parallel
          test -x build-launcher/kyty_droiddeck_launcher
          file build-launcher/kyty_droiddeck_launcher

      - name: Create AppDir
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir
          mkdir -p AppDir/usr/lib/kytyps5/lib AppDir/usr/bin
          cp -a upstream/. AppDir/usr/lib/kytyps5/
          cp build-launcher/kyty_droiddeck_launcher AppDir/usr/lib/kytyps5/

          cp /usr/bin/busybox AppDir/usr/bin/busybox
          ln -s busybox AppDir/usr/bin/unzip

          chmod +x \
            AppDir/usr/lib/kytyps5/kyty_droiddeck_launcher \
            AppDir/usr/lib/kytyps5/kyty_emulator \
            AppDir/usr/bin/busybox

          copy_lib() {
            local lib="$1" src
            src="$(ldconfig -p | awk -v lib="$lib" '$1 == lib && $NF ~ /x86_64-linux-gnu/ {print $NF; exit}')"
            [[ -n "$src" ]] || src="/usr/lib/x86_64-linux-gnu/$lib"
            [[ -e "$src" ]] || { echo "Missing $lib"; exit 1; }
            cp -aL "$src" "AppDir/usr/lib/kytyps5/lib/$lib"
          }
          copy_lib libOpenGL.so.0
          copy_lib libGLdispatch.so.0
          copy_lib libGLX.so.0
          copy_lib libGL.so.1

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          set -u
          APPDIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          KYTY_DIR="$APPDIR/usr/lib/kytyps5"
          export KYTY_DIR
          export KYTY_UNZIP="$APPDIR/usr/bin/unzip"
          export LD_LIBRARY_PATH="$KYTY_DIR:$KYTY_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          [[ -d "$KYTY_DIR/plugins" ]] && export QT_PLUGIN_PATH="$KYTY_DIR/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"
          [[ -d "$KYTY_DIR/lib/plugins" ]] && export QT_PLUGIN_PATH="$KYTY_DIR/lib/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"

          PHONE_STORAGE=/storage/emulated/0
          PHONE_GAMES="$PHONE_STORAGE/KytyPS5"
          mkdir -p "$PHONE_GAMES" /root 2>/dev/null || true
          if [[ -d "$PHONE_STORAGE" ]]; then
            ln -sfn "$PHONE_STORAGE" /root/PhoneStorage 2>/dev/null || true
            [[ -d "$PHONE_STORAGE/Download" ]] && ln -sfn "$PHONE_STORAGE/Download" /root/Downloads 2>/dev/null || true
            ln -sfn "$PHONE_GAMES" /root/Games 2>/dev/null || true
            export KYTY_GAMES_DIR="$PHONE_GAMES"
          fi

          cd "$KYTY_DIR" || exit 1
          exec "$KYTY_DIR/kyty_droiddeck_launcher" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/kytyps5.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KytyPS5 DroidDeck
          Comment=Big Picture PS5 frontend powered by KytyPS5
          Exec=kyty_droiddeck_launcher
          Icon=kytyps5
          Terminal=false
          Categories=Game;Emulator;
          EOF

          cat > AppDir/kytyps5.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1769ff"/>
                <stop offset="0.6" stop-color="#315cff"/>
                <stop offset="1" stop-color="#8f55ff"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="#05080e"/>
            <rect x="62" y="62" width="388" height="388" rx="96" fill="url(#g)"/>
            <text x="256" y="302" text-anchor="middle" font-family="sans-serif" font-size="160" font-weight="900" fill="white">K5</text>
          </svg>
          EOF
          ln -sf kytyps5.svg AppDir/.DirIcon

      - name: Download appimagetool
        if: steps.existing.outputs.exists != 'true'
        run: |
          curl -fL --retry 5 -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          export ARCH=x86_64
          ./appimagetool.AppImage --appimage-extract-and-run AppDir "$OUTPUT_NAME"
          chmod +x "$OUTPUT_NAME"
          sha256sum "$OUTPUT_NAME" | tee "$OUTPUT_NAME.sha256"

      - name: Verify AppImage
        if: steps.existing.outputs.exists != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, struct
          data = Path(os.environ['OUTPUT_NAME']).read_bytes()[:20]
          assert data[:4] == b'\x7fELF'
          assert struct.unpack('<H', data[18:20])[0] == 62
          assert data[8:11] == b'AI\x02'
          print('x86_64 AppImage Type 2: OK')
          PY

      - name: Upload artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-DroidDeck-${{ steps.upstream.outputs.release_tag }}
          path: |
            KytyPS5-DroidDeck-x86_64.AppImage
            KytyPS5-DroidDeck-x86_64.AppImage.sha256
          compression-level: 0

      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        run: |
          SHA="$(cut -d' ' -f1 "$OUTPUT_NAME.sha256")"
          cat > notes.md <<EOF
          KytyPS5 for DroidDeck/FEX — packaging revision r$PACKAGE_REV.

          r12 replaces the old desktop-style launcher with a new Big Picture frontend:
          - true frameless fullscreen launcher using the current DroidDeck screen geometry
          - 1280x720 / 720p is the baseline UI size; typography, art and game tiles scale with the actual display height
          - fullscreen is asserted again after the window appears and whenever Kyty returns to the frontend
          - large hero panel plus horizontal controller-first game carousel
          - strong cyan focus state so the selected game or setting is always obvious
          - fullscreen settings pages with Graphics / System / Controller / Debug / Expert sections
          - built-in Add Game browser inside the same window
          - built-in text editor for path and mapping settings; no QFileDialog or QMessageBox required
          - compact in-window error page with the raw core log hidden until X is pressed
          - controller flow: D-pad/left stick navigate, A select/launch, B back, X settings/change value, Y add game, LB/RB switch settings sections

          The experimental FEX Kyty core patch remains enabled:
          - removes the extra contiguous 13.5 GiB writable direct-memory alias
          - keeps the sparse memfd backing store
          - uses pread/pwrite for CPU-side backing reads and writes
          - keeps real PS5 guest mappings on the same memfd

          Upstream release: $TAG
          SHA-256: $SHA
          EOF
          gh release create "$RELEASE_TAG" "$OUTPUT_NAME" "$OUTPUT_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KytyPS5 DroidDeck · $TAG · r$PACKAGE_REV" \
            --notes-file notes.md --latest
