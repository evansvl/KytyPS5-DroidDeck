name: Build KytyPS5 DroidDeck AppImage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: kytyps5-appimage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: KytyPS5/KytyPS5
      OUTPUT_NAME: KytyPS5-DroidDeck-x86_64.AppImage
      PACKAGE_REV: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest KytyPS5 release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest"
          )"

          TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"

          ASSET_URL="$(
            jq -r '
              .assets[]
              | select(.name | test("Linux-x86_64\\.tar\\.gz$"))
              | .browser_download_url
            ' <<< "$RELEASE_JSON" | head -n 1
          )"

          ASSET_NAME="$(
            jq -r '
              .assets[]
              | select(.name | test("Linux-x86_64\\.tar\\.gz$"))
              | .name
            ' <<< "$RELEASE_JSON" | head -n 1
          )"

          test -n "$TAG"
          test "$TAG" != "null"
          test -n "$ASSET_URL"
          test "$ASSET_URL" != "null"

          RELEASE_TAG="${TAG}-droiddeck.${PACKAGE_REV}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build and runtime libraries
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libopengl0 \
            libglx0 \
            libgl1 \
            libglvnd0

      - name: Download KytyPS5
        if: steps.existing.outputs.exists != 'true'
        env:
          ASSET_URL: ${{ steps.upstream.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output kyty-linux.tar.gz \
            "$ASSET_URL"

          mkdir -p upstream

          tar \
            -xzf kyty-linux.tar.gz \
            -C upstream

          test -f upstream/kyty_launcher
          test -f upstream/kyty_emulator

          file upstream/kyty_launcher
          file upstream/kyty_emulator

      - name: Create AppDir
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AppDir

          mkdir -p AppDir/usr/lib/kytyps5
          mkdir -p AppDir/usr/lib/kytyps5/lib

          cp -a upstream/. AppDir/usr/lib/kytyps5/

          chmod +x \
            AppDir/usr/lib/kytyps5/kyty_launcher \
            AppDir/usr/lib/kytyps5/kyty_emulator

          copy_lib() {
            local lib="$1"
            local src

            src="$(
              ldconfig -p \
              | awk -v lib="$lib" '
                  $1 == lib && $NF ~ /x86_64-linux-gnu/ {
                    print $NF
                    exit
                  }
                '
            )"

            if [[ -z "$src" ]]; then
              src="/usr/lib/x86_64-linux-gnu/$lib"
            fi

            if [[ ! -e "$src" ]]; then
              echo "Missing required library: $lib"
              exit 1
            fi

            cp -aL \
              "$src" \
              "AppDir/usr/lib/kytyps5/lib/$lib"
          }

          copy_lib libOpenGL.so.0
          copy_lib libGLdispatch.so.0
          copy_lib libGLX.so.0
          copy_lib libGL.so.1

          cat > qprocess-fork.c <<'EOF'
          #include <sys/types.h>

          __attribute__((visibility("default")))
          pid_t __interceptor_vfork(void)
          {
              return -1;
          }
          EOF

          gcc \
            -shared \
            -fPIC \
            -O2 \
            -Wl,-soname,libqprocess-fork.so \
            -o AppDir/usr/lib/kytyps5/lib/libqprocess-fork.so \
            qprocess-fork.c

          file AppDir/usr/lib/kytyps5/lib/libqprocess-fork.so

          nm -D AppDir/usr/lib/kytyps5/lib/libqprocess-fork.so \
            | grep __interceptor_vfork

          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash

          set -u

          APPDIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
          KYTY_DIR="$APPDIR/usr/lib/kytyps5"

          cd "$KYTY_DIR" || exit 1

          export LD_LIBRARY_PATH="$KYTY_DIR:$KYTY_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_PRELOAD="$KYTY_DIR/lib/libqprocess-fork.so${LD_PRELOAD:+:$LD_PRELOAD}"

          if [[ -d "$KYTY_DIR/plugins" ]]; then
            export QT_PLUGIN_PATH="$KYTY_DIR/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"
          fi

          if [[ -d "$KYTY_DIR/lib/plugins" ]]; then
            export QT_PLUGIN_PATH="$KYTY_DIR/lib/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"
          fi

          echo
          echo "=========================================="
          echo " KytyPS5 DroidDeck"
          echo "=========================================="
          echo "Architecture: $(uname -m)"
          echo "APPDIR: $APPDIR"
          echo "KYTY_DIR: $KYTY_DIR"
          echo

          echo "========== Android storage =========="

          PHONE_STORAGE="/storage/emulated/0"
          PHONE_DOWNLOADS="$PHONE_STORAGE/Download"
          PHONE_GAMES="$PHONE_STORAGE/KytyPS5"

          mkdir -p /root 2>/dev/null || true

          if [[ -d "$PHONE_STORAGE" ]]; then
            echo "Android internal storage detected:"
            echo "$PHONE_STORAGE"

            ln -sfn \
              "$PHONE_STORAGE" \
              /root/PhoneStorage \
              2>/dev/null || true

            if [[ -d "$PHONE_DOWNLOADS" ]]; then
              ln -sfn \
                "$PHONE_DOWNLOADS" \
                /root/Downloads \
                2>/dev/null || true
            fi

            mkdir -p "$PHONE_GAMES" 2>/dev/null || true

            if [[ -d "$PHONE_GAMES" ]]; then
              ln -sfn \
                "$PHONE_GAMES" \
                /root/Games \
                2>/dev/null || true

              export KYTY_GAMES_DIR="$PHONE_GAMES"

              echo
              echo "Game folder:"
              echo "$PHONE_GAMES"
              echo
              echo "Kyty shortcut:"
              echo "/root/Games"
            else
              echo "Unable to create:"
              echo "$PHONE_GAMES"
            fi
          else
            echo "WARNING:"
            echo "/storage/emulated/0 is not available inside this DroidDeck session"
          fi

          echo
          echo "Root shortcuts:"
          ls -lah /root/PhoneStorage /root/Downloads /root/Games 2>/dev/null || true
          echo

          echo "========== qprocess fork shim =========="

          file "$KYTY_DIR/lib/libqprocess-fork.so" || true

          nm -D "$KYTY_DIR/lib/libqprocess-fork.so" \
            | grep __interceptor_vfork || true

          echo
          echo "========== kyty_launcher =========="

          file "$KYTY_DIR/kyty_launcher" || true
          ldd "$KYTY_DIR/kyty_launcher" || true

          echo
          echo "========== kyty_emulator =========="

          file "$KYTY_DIR/kyty_emulator" || true
          ldd "$KYTY_DIR/kyty_emulator" || true

          echo
          echo "========== missing libraries =========="

          (
            ldd "$KYTY_DIR/kyty_launcher" || true
            ldd "$KYTY_DIR/kyty_emulator" || true
          ) | grep "not found" || echo "No missing libraries reported by ldd"

          echo
          echo "========== kyty_emulator direct test =========="

          set +e

          timeout 15s \
            "$KYTY_DIR/kyty_emulator" \
            > /tmp/kyty-emulator-test.log \
            2>&1

          EMULATOR_RC=$?

          set -e

          cat /tmp/kyty-emulator-test.log || true

          echo
          echo "kyty_emulator exit code: $EMULATOR_RC"

          case "$EMULATOR_RC" in
            0)
              echo "kyty_emulator test exited normally"
              ;;
            124)
              echo "kyty_emulator test timed out"
              ;;
            132)
              echo "kyty_emulator received SIGILL"
              ;;
            134)
              echo "kyty_emulator received SIGABRT"
              ;;
            137)
              echo "kyty_emulator received SIGKILL"
              ;;
            139)
              echo "kyty_emulator received SIGSEGV"
              ;;
          esac

          echo
          echo "========== starting launcher =========="
          echo

          exec "$KYTY_DIR/kyty_launcher" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/kytyps5.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=KytyPS5
          Comment=PlayStation 5 translation layer for DroidDeck
          Exec=kyty_launcher
          Icon=kytyps5
          Terminal=false
          Categories=Game;Emulator;
          StartupNotify=true
          EOF

          cat > AppDir/kytyps5.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="96" fill="#15171c"/>
            <rect x="48" y="48" width="416" height="416" rx="72" fill="#20242c"/>
            <text x="256" y="235" text-anchor="middle" font-family="sans-serif" font-size="84" font-weight="700" fill="white">Kyty</text>
            <text x="256" y="330" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="700" fill="white">PS5</text>
          </svg>
          EOF

          ln -sf kytyps5.svg AppDir/.DirIcon

      - name: Check bundled files
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          ls -lah AppDir/usr/lib/kytyps5/lib/

          file \
            AppDir/usr/lib/kytyps5/lib/libOpenGL.so.0 \
            AppDir/usr/lib/kytyps5/lib/libGLdispatch.so.0 \
            AppDir/usr/lib/kytyps5/lib/libGLX.so.0 \
            AppDir/usr/lib/kytyps5/lib/libGL.so.1 \
            AppDir/usr/lib/kytyps5/lib/libqprocess-fork.so

          echo
          echo "Launcher dependencies:"

          LD_LIBRARY_PATH="$PWD/AppDir/usr/lib/kytyps5:$PWD/AppDir/usr/lib/kytyps5/lib" \
            ldd AppDir/usr/lib/kytyps5/kyty_launcher || true

          echo
          echo "Emulator dependencies:"

          LD_LIBRARY_PATH="$PWD/AppDir/usr/lib/kytyps5:$PWD/AppDir/usr/lib/kytyps5/lib" \
            ldd AppDir/usr/lib/kytyps5/kyty_emulator || true

      - name: Download appimagetool
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output appimagetool-x86_64.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"

          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          export ARCH=x86_64

          ./appimagetool-x86_64.AppImage \
            --appimage-extract-and-run \
            AppDir \
            "$OUTPUT_NAME"

          chmod +x "$OUTPUT_NAME"

          ls -lh "$OUTPUT_NAME"
          file "$OUTPUT_NAME"

      - name: Verify AppImage
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import struct

          path = Path(os.environ["OUTPUT_NAME"])
          data = path.read_bytes()[:20]

          if data[:4] != b"\x7fELF":
              raise SystemExit("Output is not ELF")

          machine = struct.unpack("<H", data[18:20])[0]

          if machine != 62:
              raise SystemExit(
                  f"Expected x86_64 ELF machine 62, got {machine}"
              )

          if data[8:11] != b"AI\x02":
              raise SystemExit(
                  f"Expected AppImage Type 2, got {data[8:11]!r}"
              )

          print("x86_64 AppImage Type 2: OK")
          PY

          sha256sum "$OUTPUT_NAME" \
            | tee "$OUTPUT_NAME.sha256"

      - name: Upload artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-DroidDeck-${{ steps.upstream.outputs.release_tag }}
          path: |
            KytyPS5-DroidDeck-x86_64.AppImage
            KytyPS5-DroidDeck-x86_64.AppImage.sha256
          compression-level: 0

      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
          UPSTREAM_ASSET: ${{ steps.upstream.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          SHA256="$(
            cut -d' ' -f1 "$OUTPUT_NAME.sha256"
          )"

          cat > release-notes.md <<EOF
          KytyPS5 x86_64 AppImage for DroidDeck/FEX.

          Upstream: $UPSTREAM_REPO
          Upstream release: $UPSTREAM_TAG
          Upstream asset: $UPSTREAM_ASSET
          DroidDeck packaging revision: $PACKAGE_REV

          Android storage shortcuts:
          /root/PhoneStorage -> /storage/emulated/0
          /root/Downloads -> /storage/emulated/0/Download
          /root/Games -> /storage/emulated/0/KytyPS5

          SHA-256:
          $SHA256
          EOF

          gh release create "$RELEASE_TAG" \
            "$OUTPUT_NAME" \
            "$OUTPUT_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KytyPS5 DroidDeck · $UPSTREAM_TAG · r$PACKAGE_REV" \
            --notes-file release-notes.md \
            --latest
